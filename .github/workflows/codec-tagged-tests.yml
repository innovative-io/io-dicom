name: Codec Tagged Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tagged-codec-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            git \
            libbrotli-dev \
            libgif-dev \
            libhwy-dev \
            libjpeg-dev \
            libpng-dev \
            make \
            nasm \
            ninja-build \
            perl \
            pkg-config \
            python3 \
            yasm \
            zlib1g-dev

      - name: Cache source-built codec dependencies
        id: codec-deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.local/codec-deps
            ${{ github.workspace }}/.build/codec-deps
          key: ${{ runner.os }}-codec-deps-${{ hashFiles('tools/build_codec_deps_from_source.sh') }}

      - name: Build codec dependencies from source
        if: steps.codec-deps-cache.outputs.cache-hit != 'true'
        env:
          PREFIX: ${{ github.workspace }}/.local/codec-deps
          WORK_DIR: ${{ github.workspace }}/.build/codec-deps
          JOBS: 4
        run: ./scripts/build_codec_deps_from_source.sh

      - name: Load codec dependency environment
        env:
          PREFIX: ${{ github.workspace }}/.local/codec-deps
        run: |
          test -f "$PREFIX/env.sh"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          source "$PREFIX/env.sh"
          {
            echo "CODEC_DEPS_PREFIX=$CODEC_DEPS_PREFIX"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "CGO_CFLAGS=$CGO_CFLAGS"
            echo "CGO_LDFLAGS=$CGO_LDFLAGS"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      - name: Run transfer syntax/media contract checks
        run: make contract-check
